
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171426">
    <title>PokéMemories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171426;
            color: #f5f0ff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 28px 20px 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 29px;
            letter-spacing: 1px;
        }

        header p {
            color: #aaa1bd;
            font-size: 13px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 12px 16px 35px;
        }

        .progress {
            padding: 18px;
            background: #241f36;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-info strong {
            font-size: 25px;
            color: #c9a7ff;
        }

        .bar {
            height: 9px;
            background: #39324e;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0;
            background: #a77aff;
            transition: width .25s;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filters button {
            flex: 1;
            border: 0;
            border-radius: 12px;
            padding: 11px 5px;
            background: #29233d;
            color: #c5bdd5;
            font-size: 13px;
        }

        .filters button.active {
            background: #a77aff;
            color: #171426;
            font-weight: bold;
        }

        .search {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;
            border: 1px solid #39324e;
            border-radius: 12px;
            background: #241f36;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            min-width: 0;
            border: 2px solid transparent;
            border-radius: 13px;
            background: #241f36;
            padding: 7px;
            text-align: center;
            cursor: pointer;
            transition: .2s;
        }

        .card.owned {
            border-color: #a77aff;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 63 / 88;
            border-radius: 8px;
            background: linear-gradient(145deg, #39324e, #211b32);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #a99bbf;
            font-size: 30px;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            margin-top: 9px;
            overflow-wrap: anywhere;
        }

        .card-number {
            font-size: 10px;
            color: #aaa1bd;
            margin-top: 4px;
        }

        .card-status {
            font-size: 10px;
            margin-top: 7px;
            color: #aaa1bd;
        }

        .owned .card-status {
            color: #c9a7ff;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #aaa1bd;
            padding: 35px 10px;
        }

        footer {
            text-align: center;
            color: #777087;
            font-size: 11px;
            padding: 20px;
        }

        @media (min-width: 650px) {
            .grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PokéMemories ✨</h1>
    <p>La mia collezione, un ricordo alla volta</p>
</header>

<main>
    <section class="progress">
        <div class="progress-info">
            <div>
                <strong id="count">0 / 6</strong>
                <div style="color:#aaa1bd;font-size:12px">
                    Carte acquisite
                </div>
            </div>
            <strong id="percentage">0%</strong>
        </div>

        <div class="bar">
            <div class="bar-fill" id="bar"></div>
        </div>
    </section>

    <div class="filters">
        <button class="active" data-filter="all">Tutte</button>
        <button data-filter="missing">Mancanti</button>
        <button data-filter="owned">Acquisite</button>
    </div>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Cerca una carta..."
    >

    <section class="grid" id="grid"></section>
</main>

<footer>
    PokéMemories · La mia collezione Pokémon
</footer>

<script>
    const cards = [
        { id: 1, name: "Carta dimostrativa 1", number: "001" },
        { id: 2, name: "Carta dimostrativa 2", number: "002" },
        { id: 3, name: "Carta dimostrativa 3", number: "003" },
        { id: 4, name: "Carta dimostrativa 4", number: "004" },
        { id: 5, name: "Carta dimostrativa 5", number: "005" },
        { id: 6, name: "Carta dimostrativa 6", number: "006" }
    ];

    const STORAGE_KEY = "poke-memories-owned";

    let owned = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );

    let currentFilter = "all";

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");

    function updateProgress() {
        const total = cards.length;
        const acquired = cards.filter(
            card => owned.includes(card.id)
        ).length;

        const percentage = total
            ? Math.round(acquired / total * 100)
            : 0;

        document.getElementById("count").textContent =
            `${acquired} / ${total}`;

        document.getElementById("percentage").textContent =
            `${percentage}%`;

        document.getElementById("bar").style.width =
            `${percentage}%`;
    }

    function renderCards() {
        const query = search.value.toLowerCase();

        const filtered = cards.filter(card => {
            const isOwned = owned.includes(card.id);

            const matchesFilter =
                currentFilter === "all" ||
                (currentFilter === "owned" && isOwned) ||
                (currentFilter === "missing" && !isOwned);

            const matchesSearch =
                card.name.toLowerCase().includes(query) ||
                card.number.includes(query);

            return matchesFilter && matchesSearch;
        });

        grid.innerHTML = "";

        if (!filtered.length) {
            grid.innerHTML =
                '<div class="empty">Nessuna carta trovata.</div>';
        }

        filtered.forEach(card => {
            const isOwned = owned.includes(card.id);

            const element = document.createElement("div");
            element.className = `card ${isOwned ? "owned" : ""}`;

            element.innerHTML = `
                <div class="card-image">✧</div>
                <div class="card-name"></div>
                <div class="card-number">#${card.number}</div>
                <div class="card-status">
                    ${isOwned ? "✓ Acquisita" : "○ Mancante"}
                </div>
            `;

            element.querySelector(".card-name").textContent =
                card.name;

            element.addEventListener("click", () => {
                toggleCard(card.id);
            });

            grid.appendChild(element);
        });

        updateProgress();
    }

    function toggleCard(id) {
        if (owned.includes(id)) {
            owned = owned.filter(item => item !== id);
        } else {
            owned.push(id);
        }

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(owned)
        );

        renderCards();
    }

    document.querySelectorAll(".filters button").forEach(button => {
        button.addEventListener("click", () => {
            currentFilter = button.dataset.filter;

            document.querySelectorAll(".filters button")
                .forEach(item => item.classList.remove("active"));

            button.classList.add("active");

            renderCards();
        });
    });

    search.addEventListener("input", renderCards);

    renderCards();
</script>

</body>
</html>
