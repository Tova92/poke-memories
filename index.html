
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171426">
    <title>PokéMemories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171426;
            color: #f5f0ff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 28px 20px 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 29px;
            letter-spacing: 1px;
        }

        header p {
            color: #aaa1bd;
            font-size: 13px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 12px 16px 35px;
        }

        .progress {
            padding: 18px;
            background: #241f36;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-info strong {
            font-size: 25px;
            color: #c9a7ff;
        }

        .bar {
            height: 9px;
            background: #39324e;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0;
            background: #a77aff;
            transition: width .25s;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            cursor: pointer;
        }

        .filters button {
            flex: 1;
            border: 0;
            border-radius: 12px;
            padding: 11px 5px;
            background: #29233d;
            color: #c5bdd5;
            font-size: 13px;
        }

        .filters button.active {
            background: #a77aff;
            color: #171426;
            font-weight: bold;
        }

        .search {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;
            border: 1px solid #39324e;
            border-radius: 12px;
            background: #241f36;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .search::placeholder {
            color: #aaa1bd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            min-width: 0;
            border: 2px solid transparent;
            border-radius: 13px;
            background: #241f36;
            padding: 7px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, transform .2s;
        }

        .card:active {
            transform: scale(.97);
        }

        .card.owned {
            border-color: #51465e;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 63 / 88;
            border-radius: 8px;
            background: linear-gradient(145deg, #39324e, #211b32);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter .25s;
        }

        .card.owned .card-image img {
            filter: grayscale(1) brightness(.48);
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            margin-top: 9px;
            overflow-wrap: anywhere;
        }

        .card-number {
            font-size: 10px;
            color: #aaa1bd;
            margin-top: 4px;
        }

        .card-status {
            font-size: 10px;
            margin-top: 7px;
            color: #c9a7ff;
        }

        .card.owned .card-status {
            color: #aaa1bd;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #aaa1bd;
            padding: 35px 10px;
        }

        .section-title {
            grid-column: 1 / -1;
            margin: 24px 0 8px;
            color: #f5f0ff;
            font-size: 19px;
            font-weight: 600;
        }
        
        .section-title:first-child {
            margin-top: 0;
        }

        footer {
            text-align: center;
            color: #777087;
            font-size: 11px;
            padding: 20px;
        }

        /* ANTEPRIMA */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(10, 8, 17, .96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .modal.open {
            display: flex;
        }

        .modal-close {
            position: absolute;
            top: max(18px, env(safe-area-inset-top));
            right: 20px;
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: #39324e;
            color: white;
            font-size: 25px;
        }

        .modal-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 520px;
        }

        .modal-arrow {
            flex-shrink: 0;
            width: 38px;
            height: 48px;
            border: 0;
            border-radius: 12px;
            background: #29233d;
            color: white;
            font-size: 24px;
        }

        .modal-image {
            max-width: min(65vw, 350px);
            max-height: 56vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        .modal-image.owned {
            filter: grayscale(1) brightness(.48);
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 18px;
        }

        .modal-details h2 {
            font-size: 19px;
            margin: 0 0 6px;
        }

        .modal-details p {
            font-size: 13px;
            color: #aaa1bd;
            margin: 0 0 15px;
        }
      
        .modal-status {
            border: 0;
            border-radius: 12px;
            padding: 13px 24px;
            background: #a77aff;
            color: #171426;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-status.owned {
            background: #39324e;
            color: #f5f0ff;
        }

        .modal-eye {
            margin-bottom: 12px;
            padding: 10px 18px;
            border: 1px solid #51465e;
            border-radius: 12px;
            background: #29233d;
            color: #f5f0ff;
            font-size: 13px;
            visibility: hidden;
        }

        .modal-eye:active {
            background: #51465e;
        }

        .modal-eye.visible {
            visibility: visible;
        }

        @media (min-width: 650px) {
            .grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }

            .modal-image {
                max-height: 65vh;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PokéMemories ✨</h1>
    <p>Ogni carta conquistata è un nuovo traguardo</p>
</header>

<main>
    <section class="progress">
        <div class="progress-info">
            <div>
                <strong id="count">0 / 6</strong>
                <div style="color:#aaa1bd;font-size:12px">
                    Carte acquisite
                </div>
            </div>
            <strong id="percentage">0%</strong>
        </div>

        <div class="bar">
            <div class="bar-fill" id="bar"></div>
        </div>
    </section>

    <div class="filters">
        <button class="active" data-filter="all">Tutte</button>
        <button data-filter="missing">Mancanti</button>
        <button data-filter="owned">Acquisite</button>
    </div>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Cerca per nome o numero..."
    >

    <section class="grid" id="grid"></section>
</main>

<footer>
    PokéMemories · La mia collezione Pokémon
</footer>

<!-- ANTEPRIMA A TUTTO SCHERMO -->

<div class="modal" id="modal">
    <button class="modal-close" id="closeModal">×</button>

    <div class="modal-content">
        <button class="modal-arrow" id="previousCard">‹</button>

        <img class="modal-image" id="modalImage" src="" alt="Carta Pokémon">

        <button class="modal-arrow" id="nextCard">›</button>
    </div>

    <div class="modal-details">
        <h2 id="modalName"></h2>
        <p id="modalNumber"></p>

        <button class="modal-eye" id="toggleVisibility">
            👁 Mostra a colori
        </button>

        <button class="modal-status" id="toggleStatus"></button>
    </div>
</div>


<script>
    const STORAGE_KEY = "poke-memories-owned";

    const defaultOwned = [1, 3, 5];

    let cards = [];
    let owned = [];
    let currentFilter = "all";
    let currentCardId = null;
    let revealCard = false;

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const modal = document.getElementById("modal");

    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        owned = saved === null
            ? [...defaultOwned]
            : JSON.parse(saved);

        if (!Array.isArray(owned)) {
            owned = [...defaultOwned];
        }
    } catch {
        owned = [...defaultOwned];
    }

    function updateProgress() {
        const total = cards.length;

        const acquired = cards.filter(
            card => owned.includes(card.id)
        ).length;

        const percentage = total
            ? Math.round(acquired / total * 100)
            : 0;

        document.getElementById("count").textContent =
            `${acquired} / ${total}`;

        document.getElementById("percentage").textContent =
            `${percentage}%`;

        document.getElementById("bar").style.width =
            `${percentage}%`;
    }

    function renderCards() {
        const query = search.value.toLowerCase().trim();
    
        const filtered = cards.filter(card => {
            const isOwned = owned.includes(card.id);
    
            const matchesFilter =
                currentFilter === "all" ||
                (currentFilter === "owned" && isOwned) ||
                (currentFilter === "missing" && !isOwned);
    
            const matchesSearch =
                card.name.toLowerCase().includes(query) ||
                card.number.toLowerCase().includes(query);
    
            return matchesFilter && matchesSearch;
        });
    
        grid.innerHTML = "";
    
        if (!filtered.length) {
            grid.innerHTML = '<div class="empty">Nessuna carta trovata.</div>';
            updateProgress();
            return;
        }
    
        const sections = new Map();
    
        filtered.forEach(card => {
            const section = card.section || "Altre carte";
    
            if (!sections.has(section)) {
                sections.set(section, []);
            }
    
            sections.get(section).push(card);
        });
    
        sections.forEach((sectionCards, sectionName) => {
            const title = document.createElement("h2");
            title.className = "section-title";
            title.textContent = sectionName;
    
            grid.appendChild(title);
    
            sectionCards.forEach(card => {
                const isOwned = owned.includes(card.id);
    
                const element = document.createElement("div");
                element.className = `card ${isOwned ? "owned" : ""}`;
    
                element.innerHTML = `
                    <div class="card-image">
                        <img src="${card.image}" alt="${card.name}" loading="lazy">
                    </div>
                    <div class="card-name"></div>
                    <div class="card-number">#${card.number}</div>
                    <div class="card-status">
                        ${isOwned ? "✓ Acquisita" : "○ Mancante"}
                    </div>
                `;
    
                element.querySelector(".card-name").textContent = card.name;
    
                element.addEventListener("click", () => {
                    openModal(card.id);
                });
    
                grid.appendChild(element);
            });
        });
    
        updateProgress();
    }

    function saveOwned() {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(owned)
        );
    }

    function toggleCard(id) {
        if (owned.includes(id)) {
            owned = owned.filter(item => item !== id);
        } else {
            owned.push(id);
        }

        revealCard = false;

        saveOwned();
        renderCards();
        updateModal();
    }

    function openModal(id) {
        currentCardId = id;
        revealCard = false;

        updateModal();

        modal.classList.add("open");
        document.body.style.overflow = "hidden";
    }

    function closeModal() {
        modal.classList.remove("open");
        document.body.style.overflow = "";

        currentCardId = null;
        revealCard = false;
    }

    function updateModal() {
        const card = cards.find(
            item => item.id === currentCardId
        );

        if (!card) {
            return;
        }

        const isOwned = owned.includes(card.id);

        if (!isOwned) {
            revealCard = false;
        }

        const image = document.getElementById("modalImage");

        image.src = card.image;
        image.alt = card.name;

        image.classList.toggle(
            "owned",
            isOwned && !revealCard
        );

        const eyeButton =
            document.getElementById("toggleVisibility");

        eyeButton.classList.toggle("visible", isOwned);

        eyeButton.textContent = revealCard
            ? "👁 Nascondi colori"
            : "👁 Mostra a colori";

        document.getElementById("modalName").textContent =
            card.name;

        document.getElementById("modalNumber").textContent =
            `Carta #${card.number}`;

        const button = document.getElementById("toggleStatus");

        button.textContent = isOwned
            ? "Rimuovi dai posseduti"
            : "Segna come acquisita";

        button.classList.toggle("owned", isOwned);
    }

    function navigateModal(direction) {
        const position = cards.findIndex(
            item => item.id === currentCardId
        );

        const nextPosition =
            (position + direction + cards.length) % cards.length;

        currentCardId = cards[nextPosition].id;
        revealCard = false;

        updateModal();
    }

    async function loadCards() {
        grid.innerHTML =
            '<div class="empty">Caricamento delle carte...</div>';

        try {
            const response = await fetch("./cards.json");

            if (!response.ok) {
                throw new Error("Impossibile caricare cards.json");
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error("Il catalogo non è un elenco valido");
            }

            const ids = new Set();

            cards = data.map(card => {
                if (
                    card.id === undefined ||
                    !card.name ||
                    !card.number ||
                    !card.image ||
                    ids.has(card.id)
                ) {
                    throw new Error("Una o più carte hanno dati mancanti o ID duplicati");
                }

                ids.add(card.id);

                return card;
            });

            renderCards();
        } catch (error) {
            console.error(error);

            grid.innerHTML = `
                <div class="empty">
                    Non è stato possibile caricare il catalogo.
                    Controlla che cards.json sia presente
                    nella stessa cartella di index.html.
                </div>
            `;
        }
    }

    document.querySelectorAll(".filters button").forEach(button => {
        button.addEventListener("click", () => {
            currentFilter = button.dataset.filter;

            document.querySelectorAll(".filters button")
                .forEach(item => item.classList.remove("active"));

            button.classList.add("active");

            renderCards();
        });
    });

    search.addEventListener("input", renderCards);

    document.getElementById("closeModal")
        .addEventListener("click", closeModal);

    document.getElementById("previousCard")
        .addEventListener("click", () => navigateModal(-1));

    document.getElementById("nextCard")
        .addEventListener("click", () => navigateModal(1));

    document.getElementById("toggleStatus")
        .addEventListener("click", () => {
            toggleCard(currentCardId);
        });

    document.getElementById("toggleVisibility")
        .addEventListener("click", () => {
            revealCard = !revealCard;
            updateModal();
        });

    modal.addEventListener("click", event => {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener("keydown", event => {
        if (!modal.classList.contains("open")) {
            return;
        }

        if (event.key === "Escape") {
            closeModal();
        }

        if (event.key === "ArrowLeft") {
            navigateModal(-1);
        }

        if (event.key === "ArrowRight") {
            navigateModal(1);
        }
    });

    loadCards();
</script>

</body>
</html>
