name: Update Catalog Index

on:
  push:
    paths:
      - "data/expansions/**"
      - "data/groups/**"
      - "python/create_catalog_index.py"
      - ".github/workflows/update-catalog.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalog index
        run: python python/create_catalog_index.py

      - 
      - name: Commit catalog index
        run: |
          git add data/catalog-index.json

          if git diff --cached --quiet; then
            echo "Catalog index is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update catalog index"
          git push
