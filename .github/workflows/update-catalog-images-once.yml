
name: Update Catalog Images Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update catalog images
        run: python python/update_catalog_images.py

      - name: Regenerate catalog index
        run: python python/create_catalog_index.py

      - name: Commit changes
        run: |
          git add data/expansions data/groups data/catalog-index.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update expansion and group images"
          git push
